    // 3D Voxel Canvas Component
    function InteractiveCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        let angleX = 0.5;
        let angleY = 0.5;
        let targetAngleX = 0.5;
        let targetAngleY = 0.5;

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          targetAngleY = x * 1.5;
          targetAngleX = -y * 1.5;
        };

        canvas.addEventListener('mousemove', handleMouseMove);

        const particles = Array.from({ length: 28 }).map(() => ({
          x: (Math.random() - 0.5) * 220,
          y: (Math.random() - 0.5) * 220,
          z: (Math.random() - 0.5) * 220,
          size: Math.random() * 2 + 1,
          color: Math.random() > 0.5 ? '#ff4d8d' : '#00f0ff',
          speed: Math.random() * 0.01 + 0.005
        }));

        const cubeSize = 58;
        const vertices = [
          [-cubeSize, -cubeSize, -cubeSize],
          [cubeSize, -cubeSize, -cubeSize],
          [cubeSize, cubeSize, -cubeSize],
          [-cubeSize, cubeSize, -cubeSize],
          [-cubeSize, -cubeSize, cubeSize],
          [cubeSize, -cubeSize, cubeSize],
          [cubeSize, cubeSize, cubeSize],
          [-cubeSize, cubeSize, cubeSize]
        ];

        const edges = [
          [0, 1], [1, 2], [2, 3], [3, 0],
          [4, 5], [5, 6], [6, 7], [7, 4],
          [0, 4], [1, 5], [2, 6], [3, 7]
        ];

        const render = () => {
          ctx.clearRect(0, 0, rect.width, rect.height);
          angleX += (targetAngleX - angleX) * 0.05 + 0.004;
          angleY += (targetAngleY - angleY) * 0.05 + 0.008;

          const cx = rect.width / 2;
          const cy = rect.height / 2;
          const fov = 260;

          // Draw floating particles
          particles.forEach(p => {
            p.y -= 0.3;
            if (p.y < -110) p.y = 110;
            const rotY = p.x * Math.cos(angleY) - p.z * Math.sin(angleY);
            const rotZ = p.x * Math.sin(angleY) + p.z * Math.cos(angleY);
            const rotX = p.y * Math.cos(angleX) - rotZ * Math.sin(angleX);
            const finalZ = p.y * Math.sin(angleX) + rotZ * Math.cos(angleX);

            const scale = fov / (fov + finalZ + 180);
            const x2d = cx + rotY * scale;
            const y2d = cy + rotX * scale;

            ctx.beginPath();
            ctx.arc(x2d, y2d, p.size * scale, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0.2, Math.min(0.9, scale));
            ctx.fill();
          });
          ctx.globalAlpha = 1;

          // Project Cube Vertices
          const projected = vertices.map(v => {
            const rotY = v[0] * Math.cos(angleY) - v[2] * Math.sin(angleY);
            const rotZ = v[0] * Math.sin(angleY) + v[2] * Math.cos(angleY);
            const rotX = v[1] * Math.cos(angleX) - rotZ * Math.sin(angleX);
            const finalZ = v[1] * Math.sin(angleX) + rotZ * Math.cos(angleX);

            const scale = fov / (fov + finalZ + 180);
            return {
              x: cx + rotY * scale,
              y: cy + rotX * scale,
              scale
            };
          });

          // Draw Glowing Edges
          edges.forEach(edge => {
            const p1 = projected[edge[0]];
            const p2 = projected[edge[1]];

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            const grad = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
            grad.addColorStop(0, '#ff4d8d');
            grad.addColorStop(0.5, '#9d4edd');
            grad.addColorStop(1, '#00f0ff');
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2.2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff4d8d';
            ctx.stroke();
            ctx.shadowBlur = 0;
          });

          // Draw Vertices Points
          projected.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4 * p.scale, 0, Math.PI * 2);
            ctx.fillStyle = '#00f0ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00f0ff';
            ctx.fill();
            ctx.shadowBlur = 0;
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          canvas.removeEventListener('mousemove', handleMouseMove);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="w-full h-[270px] sm:h-[310px] rounded-xl cursor-grab active:cursor-grabbing"
        />
      );
    }

                          className={`flex-1 py-3 rounded-xl font-bold text-xs tracking-wider uppercase flex items-center justify-center gap-2 transition-all ${
                            launched
                              ? 'bg-emerald-500/20 border border-emerald-500/40 text-cyber-neon'
                              : launching
                              ? 'bg-anime-pink/20 text-slate-300'
                              : 'bg-gradient-to-r from-anime-pink via-cyber-purple to-cyber-cyan text-white'
                          }`}
                        >
                          <span>{launching ? t.simulator.launching : launched ? t.simulator.active : t.simulator.btn_launch}</span>
                        </button>
                        <button
                          onClick={() => {
                            setLaunched(false);
                            setLaunching(false);
                            setLogs(["[SYSTEM] Sandbox reset.", "[STATUS] Awaiting Link Start command..."]);
                          }}
                          className="p-3 rounded-xl bg-obsidian-950 border border-white/10 text-slate-400"
                        >
                          🔄
                        </button>
                      </div>
                    </div>

                    <div className="lg:col-span-7 glass-panel rounded-2xl p-5 sm:p-6 space-y-3.5 border border-white/10 shadow-xl">
                      <div className="flex items-center justify-between pb-2.5 border-b border-white/10">
                        <span className="text-xs font-mono font-bold tracking-wider text-slate-200">
                          {t.simulator.terminal_title}
                        </span>
                        <span className="text-[10px] font-mono text-cyan-400">TTY: LIVE</span>
                      </div>

                      <div className="bg-obsidian-950/95 rounded-xl p-3.5 h-[300px] overflow-y-auto font-mono text-xs text-slate-300 space-y-1.5 border border-white/5">
                        {logs.map((log, index) => (
                          <div
                            key={index}
                            className={`leading-relaxed ${
                              log.includes('[SPAWN]') || log.includes('(≧◡≦)')
                                ? 'text-cyber-neon font-semibold'
                                : log.includes('[LINK START]') || log.includes('[RELOAD]')
                                ? 'text-anime-pink'
                                : log.includes('[WINDOWS]') || log.includes('[RUNTIME]')
                                ? 'text-cyber-cyan'
                                : 'text-slate-400'
                            }`}
                          >
                            <span className="text-slate-600 select-none mr-2">{String(index + 1).padStart(2, '0')}</span>
                            {log}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              {/* DOWNLOAD */}
              <section id="download" className="py-20 relative overflow-hidden bg-obsidian-950/80 cyber-grid">
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                  <div className="text-center max-w-2xl mx-auto mb-10 space-y-3">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyber-neon/10 border border-cyber-neon/30 text-cyber-neon text-xs font-mono font-semibold">
                      <span>✦ {t.download.tag}</span>
                    </div>
                    <h2 className="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white tracking-tight">
                      {t.download.title}
                    </h2>
                    <p className="text-slate-400 text-sm sm:text-base">{t.download.subtitle}</p>

                    <div className="flex items-center justify-center gap-3 pt-3">
                      <div className="flex items-center bg-obsidian-900 border border-anime-pink/30 p-1 rounded-xl">
                        <button
                          onClick={() => setSelectedServer('cdn')}
                          className={`px-3 py-1.5 rounded-lg text-xs font-mono ${
                            selectedServer === 'cdn'
                              ? 'bg-gradient-to-r from-anime-pink to-cyber-cyan text-white font-bold'
                              : 'text-slate-400'
                          }`}
                        >
                          {t.download.server_cdn}
                        </button>
                        <button
                          onClick={() => setSelectedServer('github')}
                          className={`px-3 py-1.5 rounded-lg text-xs font-mono ${
                            selectedServer === 'github'
                              ? 'bg-obsidian-800 text-white font-bold'
                              : 'text-slate-400'
                          }`}
                        >
                          {t.download.server_github}
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {/* Installer */}
                    <div className="glass-panel-glow rounded-2xl p-6 flex flex-col justify-between border border-anime-pink/40">
                      <div className="space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-anime-pink/15 text-anime-pink font-semibold uppercase">RECOMMENDED</span>
                          <span className="text-xs font-mono text-slate-400">{RELEASE_DATA.downloads.windows.installer.size}</span>
                        </div>
                        <h3 className="text-lg font-bold text-white">{t.download.windows_installer}</h3>
                        <p className="text-xs text-slate-300">Bộ cài hoàn chỉnh cho Windows 10 & 11 (x64), tự động tạo shortcut và cập nhật an toàn.</p>
                      </div>
                      <div className="pt-5 mt-5 border-t border-white/10">
                        <a
                          href={selectedServer === 'cdn' ? RELEASE_DATA.downloads.windows.installer.cdnUrl : RELEASE_DATA.downloads.windows.installer.githubUrl}
                          className="w-full py-3 rounded-xl font-bold text-xs tracking-wide bg-gradient-to-r from-anime-pink to-cyber-cyan text-white flex items-center justify-center gap-2"
                        >
                          <span>Tải Bản Cài Đặt (.exe)</span>
                        </a>
                      </div>
                    </div>

                    {/* Portable */}
                    <div className="glass-panel rounded-2xl p-6 flex flex-col justify-between border border-white/10 hover:border-anime-pink/40">
                      <div className="space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-cyber-purple/15 text-cyber-purple font-semibold uppercase">PORTABLE</span>
                          <span className="text-xs font-mono text-slate-400">{RELEASE_DATA.downloads.windows.portable.size}</span>
                        </div>
                        <h3 className="text-lg font-bold text-white">{t.download.windows_portable}</h3>
                        <p className="text-xs text-slate-300">Tệp thực thi duy nhất, không cần cài đặt. Tải về và khởi chạy ngay trên USB.</p>
                      </div>
                      <div className="pt-5 mt-5 border-t border-white/10">
                        <a
                          href={selectedServer === 'cdn' ? RELEASE_DATA.downloads.windows.portable.cdnUrl : RELEASE_DATA.downloads.windows.portable.githubUrl}
                          className="w-full py-3 rounded-xl font-semibold text-xs tracking-wide bg-obsidian-850 text-white border border-white/10 flex items-center justify-center gap-2"
                        >
                          <span>Tải Portable (.exe)</span>
                        </a>
                      </div>
                    </div>

                    {/* Linux */}
                    <div className="glass-panel rounded-2xl p-6 flex flex-col justify-between border border-white/10 hover:border-cyber-cyan/40">
                      <div className="space-y-3">
                        <div className="flex items-center justify-between">
                          <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/15 text-cyber-neon font-semibold uppercase">LINUX & DEVS</span>
                          <span className="text-xs font-mono text-slate-400">{RELEASE_DATA.downloads.linux.binary.size}</span>
                        </div>
                        <h3 className="text-lg font-bold text-white">{t.download.linux_binary}</h3>
                        <p className="text-xs text-slate-300">Thực thi độc lập trên Linux x64 (Ubuntu, Debian, Fedora, Arch) và Python Wheel.</p>
                      </div>
                      <div className="pt-5 mt-5 border-t border-white/10">
                        <a
                          href={selectedServer === 'cdn' ? RELEASE_DATA.downloads.linux.binary.cdnUrl : RELEASE_DATA.downloads.linux.binary.githubUrl}
                          className="w-full py-3 rounded-xl font-semibold text-xs tracking-wide bg-obsidian-850 text-white border border-white/10 flex items-center justify-center gap-2"
                        >
                          <span>Tải Linux (x64)</span>
                        </a>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              {/* CORE HUB */}
              <section id="core-hub" className="py-20 relative overflow-hidden bg-obsidian-900/40 border-t border-white/5">
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                  <div className="max-w-xl space-y-4">
                    <span className="text-xs font-mono text-anime-pink font-semibold">✦ PYTHON CORE SDK // 開発者向け</span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-white">Thư Viện mcw-core Headless</h2>
                    <p className="text-sm text-slate-300">Toàn bộ sức mạnh của launcher được đóng gói thành thư viện Python độc lập để bạn tự do xây dựng bot hoặc công cụ tự động hóa.</p>
                    <div className="p-3 rounded-xl bg-obsidian-950 border border-white/10 font-mono text-xs text-cyber-cyan flex items-center justify-between">
                      <span>$ pip install mcw-core</span>
                      <button
                        onClick={() => navigator.clipboard.writeText('pip install mcw-core')}
                        className="text-slate-400 hover:text-white"
                      >
                        Copy
                      </button>
                    </div>
                  </div>
                </div>
              </section>
            </main>

            {/* FOOTER */}
            <footer className="bg-obsidian-950 border-t border-white/10 py-8 px-6 text-slate-400 text-xs">
              <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                <span>&copy; 2026 MCW Launcher. Next-Gen Minecraft Platform.</span>
                <span className="text-anime-pink font-mono">✦ (๑•̀ㅂ•́)و✧ System Online</span>
              </div>
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
